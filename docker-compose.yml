services:
  api:
    image: hashicorp/http-echo:latest
    container_name: monitoring-api
    command: ["-text=Monitoring Service Active", "-listen=:8080"]
    expose:
      - "8080"
    networks:
      - monitoring-net
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: monitoring-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring-net
    restart: unless-stopped

networks:
  monitoring-net:
    driver: bridge
